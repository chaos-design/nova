# =============================================================================
# NOVA-LOCAL 的私有配置
# =============================================================================
# 这是一份**覆盖层**：由 index.mjs 深合并到项目根 config.yaml 之上。
# 只有这里写了的键才会覆盖根配置，其余全部沿用根 config.yaml。
#
# 典型用途：单独调某个 Agent 的预算/策略做对照实验，而不动全局配置。
# 若本文件与根 config.yaml 完全一致，删掉它也不影响运行。
#
# 仍然遵守同一条规则：敏感值与环境相关值写成 ${VAR} 插值，不落真实密钥。
# 变量名见项目根 .env.example。
# =============================================================================

agent:
  # 执行预算（覆盖根 config.yaml 的 agent.limits）
  limits:
    # 轮次预算：留两轮给压缩与交卷，保证在 NOVA 的 maxSteps 内收敛。可选
    roundBudget: ${NOVA_AGENT_ROUND_BUDGET:-6}
    # 检索尝试上限：超过就降级交卷，避免原地打转。可选
    maxSearchAttempts: ${NOVA_AGENT_MAX_SEARCH_ATTEMPTS:-5}
    # 交叉验证要求的独立来源数，达不到即判单源降级。可选
    requiredSources: ${NOVA_AGENT_REQUIRED_SOURCES:-2}
